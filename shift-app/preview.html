<meta charset="utf-8">
<style>
html,body{direction:rtl;}
:root{
  --teal:#0f766e; --teal-d:#0b5e57; --teal-l:#ccfbf1;
  --amber:#f59e0b; --amber-l:#fef3c7;
  --indigo:#6366f1; --indigo-l:#e0e7ff;
  --rest:#94a3b8; --rest-l:#f1f5f9;
  --red:#dc2626; --red-l:#fee2e2;
  --green:#16a34a; --green-l:#dcfce7;
  --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --card:#fff;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI","Tahoma","Noto Naskh Arabic",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;
  padding-bottom:76px;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:16px}
button{cursor:pointer;border:none;background:none}

/* Header */
.app-header{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(135deg,var(--teal),var(--teal-d));
  color:#fff;padding:14px 16px calc(14px + env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:var(--shadow);
}
.app-header h1{font-size:17px;margin:0;font-weight:700}
.app-header .sub{font-size:12px;opacity:.85;margin-top:2px}
.hbtn{color:#fff;font-size:20px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.14)}

/* Screens */
main{padding:14px;max-width:900px;margin:0 auto}
.screen{display:none;animation:fade .18s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2.title{font-size:16px;margin:0 0 12px}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:700}

/* Stat grid */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:800;line-height:1}
.stat .l{font-size:12px;color:var(--muted);margin-top:6px}
.stat.warn{border-color:var(--amber);background:var(--amber-l)}
.stat.bad{border-color:var(--red);background:var(--red-l)}

/* Lists */
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--teal-l);color:var(--teal-d);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12px;color:var(--muted);margin-top:2px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-صباح{background:var(--teal-l);color:var(--teal-d)}
.b-عصر{background:var(--amber-l);color:#92400e}
.b-ليل{background:var(--indigo-l);color:#3730a3}
.b-راحة{background:var(--rest-l);color:#475569}
.b-leave{background:var(--red-l);color:#991b1b}
.b-ok{background:var(--green-l);color:#166534}
.b-pending{background:var(--amber-l);color:#92400e}
.b-rej{background:var(--red-l);color:#991b1b}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--teal);color:#fff;font-weight:700;padding:11px 16px;border-radius:12px;font-size:15px}
.btn:active{background:var(--teal-d)}
.btn.block{width:100%}
.btn.ghost{background:var(--teal-l);color:var(--teal-d)}
.btn.danger{background:var(--red-l);color:var(--red)}
.btn.sm{padding:7px 12px;font-size:13px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--bg);color:var(--muted);flex:none}
.icon-btn.danger{background:var(--red-l);color:var(--red)}

.fab{position:fixed;left:16px;bottom:88px;z-index:25;background:var(--teal);color:#fff;width:56px;height:56px;border-radius:50%;font-size:28px;display:grid;place-items:center;box-shadow:0 6px 16px rgba(15,118,110,.4)}

/* Bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;padding:4px 2px;border-radius:10px}
.nav button .ic{font-size:20px}
.nav button.active{color:var(--teal)}
.nav button.active .ic{transform:translateY(-1px)}

/* Schedule table */
.sched-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sched-bar .m{font-weight:800;font-size:15px;text-align:center;flex:1}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table.sched{border-collapse:collapse;width:max-content;min-width:100%;font-size:12px}
table.sched th,table.sched td{border:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
table.sched thead th{position:sticky;top:0;background:#f1f5f9;z-index:2;padding:6px 4px;font-weight:700}
table.sched .namecol{position:sticky;right:0;background:var(--card);z-index:3;text-align:right;padding:8px 10px;min-width:130px;font-weight:700;box-shadow:-4px 0 6px -4px rgba(0,0,0,.12)}
table.sched thead .namecol{z-index:4;background:#f1f5f9}
table.sched .daycell{width:44px;height:40px;cursor:pointer;font-weight:700}
table.sched .daycell:active{outline:2px solid var(--teal)}
.d-صباح{background:var(--teal-l);color:var(--teal-d)}
.d-عصر{background:var(--amber-l);color:#92400e}
.d-ليل{background:var(--indigo-l);color:#3730a3}
.d-راحة{background:#fff;color:var(--rest)}
.d-leave{background:var(--red-l);color:#991b1b;font-size:10px}
.d-empty{background:#fafafa;color:#cbd5e1}
.daycell.edited::after{content:"";position:absolute;top:2px;left:2px;width:6px;height:6px;border-radius:50%;background:var(--teal)}
.daycell{position:relative}
.fridaycol{background:#fff7ed}
.wknd th{color:var(--red)}
table.sched tfoot td{background:#f8fafc;font-weight:700;color:var(--muted);padding:5px 4px}
table.sched tfoot td.low{background:var(--red-l);color:var(--red)}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:11px}
.leg span{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.leg i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Forms / modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{margin:0 0 14px;font-size:17px;display:flex;align-items:center;justify-content:space-between}
.sheet h3 .x{font-size:22px;color:var(--muted);padding:2px 8px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{padding:9px 14px;border-radius:11px;border:1.5px solid var(--line);font-weight:700;font-size:14px;background:var(--bg);color:var(--ink)}
.pick button.on{border-color:var(--teal);background:var(--teal-l);color:var(--teal-d)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.hint.warn{color:#92400e}
.hint.bad{color:var(--red)}
.hint.ok{color:var(--green)}

.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--teal);box-shadow:var(--shadow)}

/* Daily sheet print */
.daily-emp{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
@media print{
  .app-header,.nav,.fab,.sched-bar .btn,.no-print{display:none!important}
  body{padding:0;background:#fff}
  .card{box-shadow:none;border:1px solid #000}
  .screen{display:none!important}
  .screen.active{display:block!important}
}

</style>
<header class="app-header">
  <div>
    <h1 id="hTitle">إدارة الورديات</h1>
    <div class="sub" id="hSub">قسم العمليات الجمركية</div>
  </div>
  <button class="hbtn" id="btnSettings" title="الإعدادات">⚙️</button>
</header>

<main>
  <!-- لوحة المعلومات -->
  <section class="screen active" id="scr-dash"></section>
  <!-- الموظفون -->
  <section class="screen" id="scr-emps"></section>
  <!-- جدول الورديات -->
  <section class="screen" id="scr-sched"></section>
  <!-- الإجازات -->

<button class="fab" id="fab" title="إضافة">＋</button>

<nav class="nav">

  <button data-nav="daily"><span class="ic">📋</span>كشف يومي</button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
/* البيانات الابتدائية — مستخرجة من ملف الإكسل الأصلي.
   تُستخدم فقط عند أول تشغيل، ثم تُحفظ نسخة العمل في المتصفح (localStorage). */
window.SEED = {
  settings: {
    department: 'قسم العمليات الجمركية',
    scheduleStart: '2026-06-14',   // بداية فترة الجدول
    workDays: 6,                    // طول دورة العمل (أيام)
    restDays: 4,                    // طول الراحة الدورية (أيام)
    minWorkers: 3,                  // الحد الأدنى للعاملين يومياً
    maxLeavesPerDay: 4,             // أقصى عدد مُجازين في اليوم
    startShift: 'صباح',            // وردية بداية الفريق
    shiftTimes: {
      'صباح': '6:00 ص ← 1:00 م',
      'عصر': '1:00 م ← 9:00 م',
      'ليل': '9:00 م ← 6:00 ص (اليوم التالي)'
    },
    leaveTypes: ['سنوية', 'عارض', 'دورية', 'مرضية', 'مرافق مريض', 'غياب'],
    statuses: ['معتمد', 'قيد الانتظار', 'مرفوض'],
    holidays: [
      { date: '2026-12-18', name: 'اليوم الوطني' },
      { date: '2027-02-09', name: 'اليوم الرياضي للدولة' }
    ]
  },
  employees: [
    { id: 1, name: 'سالم شفيع المري', no: '392', cycleStart: '2026-06-14' },
    { id: 2, name: 'فهد عبدالعزيز عبدالله', no: '2306', cycleStart: '2026-06-14' },
    { id: 3, name: 'محمد ناصر الغالي', no: '4756', cycleStart: '2026-06-14' },
    { id: 4, name: 'راشد عيسى النعيمي', no: '4749', cycleStart: '2026-06-14' },
    { id: 5, name: 'طلال زايد المري', no: '2927', cycleStart: '2026-06-14' },
    { id: 6, name: 'منصور مبارك الهاجري', no: '4522', cycleStart: '2026-06-14' },
    { id: 7, name: 'محمد حمد الجابر', no: '3317', cycleStart: '2026-06-14' },
    { id: 8, name: 'عبدالله سعد الهاجري', no: '2424', cycleStart: '2026-06-14' }
  ],
  leaves: [
    { id: 1, empId: 1, type: 'دورية', from: '2026-06-17', to: '2026-06-19', status: 'معتمد', notes: '' },
    { id: 2, empId: 2, type: 'سنوية', from: '2026-06-18', to: '2026-06-19', status: 'معتمد', notes: '' },
    { id: 3, empId: 3, type: 'دورية', from: '2026-06-27', to: '2026-07-02', status: 'معتمد', notes: '' },
    { id: 4, empId: 3, type: 'دورية', from: '2026-07-05', to: '2026-07-09', status: 'معتمد', notes: '' },
    { id: 5, empId: 6, type: 'سنوية', from: '2026-07-04', to: '2026-07-09', status: 'معتمد', notes: '' },
    { id: 6, empId: 6, type: 'سنوية', from: '2026-06-18', to: '2026-06-19', status: 'معتمد', notes: '' },
    { id: 7, empId: 7, type: 'سنوية', from: '2026-06-17', to: '2026-06-19', status: 'معتمد', notes: '' },
    { id: 8, empId: 8, type: 'مرافق مريض', from: '2026-06-17', to: '2026-07-30', status: 'معتمد', notes: '' },
    { id: 9, empId: 4, type: 'سنوية', from: '2026-07-04', to: '2026-07-09', status: 'معتمد', notes: '' },
    { id: 10, empId: 4, type: 'عارض', from: '2026-07-14', to: '2026-07-14', status: 'معتمد', notes: '' },
    { id: 11, empId: 4, type: 'سنوية', from: '2026-07-15', to: '2026-07-19', status: 'معتمد', notes: '' },
    { id: 12, empId: 4, type: 'دورية', from: '2026-07-26', to: '2026-07-30', status: 'معتمد', notes: '' }
  ],
  overrides: {}   // تعديلات يدوية على الجدول: { "empId": { "YYYY-MM-DD": "قيمة الوردية" } }
};

/* ============================================================
   تطبيق إدارة الورديات — قسم العمليات الجمركية
   يعمل بالكامل داخل المتصفح، ويحفظ البيانات محلياً (localStorage).
   ============================================================ */
'use strict';

const STORE_KEY = 'shiftAppState.v1';
const WORK_SHIFTS = ['صباح', 'عصر', 'ليل'];
const REST = 'راحة';
const AR_DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

/* -------------------- الحالة والتخزين -------------------- */
let state;
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ state = JSON.parse(raw); return; }
  }catch(e){}
  state = JSON.parse(JSON.stringify(window.SEED));   // نسخة من البيانات الابتدائية
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ toast('تعذّر الحفظ — الذاكرة ممتلئة'); }
}
function resetAll(){
  if(!confirm('استرجاع كل البيانات من ملف الإكسل الأصلي؟ ستُفقد التعديلات.')) return;
  localStorage.removeItem(STORE_KEY); load(); renderAll(); toast('تمت الاستعادة');
}

/* -------------------- أدوات التاريخ -------------------- */
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function fmtDate(iso){ const d=parseISO(iso); return d.getDate()+' '+AR_MONTHS[d.getMonth()]+' '+d.getFullYear(); }
function inclusiveDays(from,to){ return daysBetween(from,to)+1; }

/* -------------------- منطق الورديات -------------------- */
// نمط الورديات خلال أيام العمل: أزواج تتدرّج صباح ← عصر ← ليل ابتداءً من وردية بداية الفريق.
function shiftPattern(){
  const s = state.settings;
  const start = WORK_SHIFTS.indexOf(s.startShift);
  const pat = [];
  for(let i=0;i<s.workDays;i++){ pat.push(WORK_SHIFTS[(start + Math.floor(i/2)) % 3]); }
  return pat;
}
// الوردية المحسوبة من الدورة فقط (بدون الإجازات أو التعديلات).
function rotationShift(emp, iso){
  const s = state.settings;
  const startISO = emp.cycleStart || s.scheduleStart;
  const diff = daysBetween(startISO, iso);
  if(diff < 0) return '';                         // قبل بداية دورة الموظف
  const cycle = s.workDays + s.restDays;
  const pos = ((diff % cycle)+cycle) % cycle;
  return pos < s.workDays ? shiftPattern()[pos] : REST;
}
// إجازة معتمدة تغطّي هذا اليوم؟
function approvedLeave(empId, iso){
  return state.leaves.find(l => l.empId===empId && l.status==='معتمد' && iso>=l.from && iso<=l.to);
}
// القيمة النهائية للخلية: تعديل يدوي ← إجازة معتمدة ← الدورة.
function cellValue(emp, iso){
  const ov = state.overrides[emp.id];
  if(ov && ov[iso]) return { value: ov[iso], source:'manual' };
  const lv = approvedLeave(emp.id, iso);
  if(lv) return { value: lv.type, source:'leave' };
  return { value: rotationShift(emp, iso), source:'auto' };
}
function isLeaveValue(v){ return state.settings.leaveTypes.includes(v); }
function classFor(v){
  if(v==='') return 'd-empty';
  if(WORK_SHIFTS.includes(v)) return 'd-'+v;
  if(v===REST) return 'd-راحة';
  return 'd-leave';
}

/* -------------------- تجميعات لليوم -------------------- */
function dayStats(iso){
  const counts={صباح:0,عصر:0,ليل:0,راحة:0,leave:0};
  let working=0, onLeave=0;
  state.employees.forEach(e=>{
    const v=cellValue(e,iso).value;
    if(v==='') return;
    if(WORK_SHIFTS.includes(v)){ counts[v]++; working++; }
    else if(v===REST){ counts.راحة++; }
    else { counts.leave++; onLeave++; }
  });
  return {counts, working, onLeave};
}

/* -------------------- التنقّل -------------------- */
const screens=['dash','emps','sched','leaves','daily'];
let current='dash';
function nav(to){
  current=to;
  screens.forEach(s=>{
    document.getElementById('scr-'+s).classList.toggle('active', s===to);
  });
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.nav===to));
  const fab=document.getElementById('fab');
  fab.style.display = (to==='emps'||to==='leaves') ? 'grid' : 'none';
  window.scrollTo(0,0);
  renderScreen(to);
}
function renderScreen(to){
  if(to==='dash') renderDash();
  else if(to==='emps') renderEmps();
  else if(to==='sched') renderSched();
  else if(to==='leaves') renderLeaves();
  else if(to==='daily') renderDaily();
}
function renderAll(){ renderScreen(current); }

/* -------------------- لوحة المعلومات -------------------- */
function renderDash(){
  const iso=toISO(today());
  const st=dayStats(iso);
  const s=state.settings;
  const low = st.working < s.minWorkers;
  const el=document.getElementById('scr-dash');
  // إجازات تبدأ خلال 7 أيام
  const soon = state.leaves.filter(l=>l.status==='معتمد' && daysBetween(iso,l.from)>=0 && daysBetween(iso,l.from)<=7);
  // متوسط أيام الإجازة
  const perEmp = {}; state.employees.forEach(e=>perEmp[e.id]=0);

let schedMonth = null;   // {y,m}
function ensureMonth(){
  if(schedMonth) return;
  const d=parseISO(state.settings.scheduleStart);

  schedMonth = { y: t.getFullYear(), m: t.getMonth() };
  // ابدأ بشهر بداية الجدول إن كان اليوم قبله
  if(t < d){ schedMonth={y:d.getFullYear(), m:d.getMonth()}; }
}
function renderSched(){
  ensureMonth();
  const el=document.getElementById('scr-sched');
  const {y,m}=schedMonth;
  const days=new Date(y,m+1,0).getDate();
  const iso0=toISO(today());
  let head='', foot1='', foot2='', foot3='', footT='';
  for(let d=1;d<=days;d++){
    const date=new Date(y,m,d); const iso=toISO(date); const wd=date.getDay();
    const wknd = (wd===5||wd===6);
    head+=`<th class="${wknd?'wknd':''} ${wd===5?'fridaycol':''}"><div>${AR_DAYS[wd].slice(0,3)}</div><div style="font-weight:800">${d}</div></th>`;
  }
  const rows=state.employees.map(e=>{
    let tds='';
    for(let d=1;d<=days;d++){
      const iso=toISO(new Date(y,m,d));

      tds+=`<td class="daycell ${classFor(cv.value)} ${cv.source==='manual'?'edited':''}" onclick="editCell(${e.id},'${iso}')">${labelShort(cv.value)}</td>`;
    }
    return `<tr><td class="namecol">${e.name}<div class="meta" style="font-weight:400;font-size:11px">${e.no}</div></td>${tds}</tr>`;
  }).join('');

  // تذييل: عدّاد لكل وردية + إجمالي + تنبيه نقص
  const shiftRows = WORK_SHIFTS.map(sh=>{
    let cells='';
    for(let d=1;d<=days;d++){ const iso=toISO(new Date(y,m,d)); cells+=`<td>${dayStats(iso).counts[sh]}</td>`; }
    return `<tr><td class="namecol">${sh}</td>${cells}</tr>`;
  }).join('');
  let totalCells='';
  for(let d=1;d<=days;d++){ const iso=toISO(new Date(y,m,d)); const w=dayStats(iso).working; totalCells+=`<td class="${w<state.settings.minWorkers?'low':''}">${w}</td>`; }

  el.innerHTML=`
    <div class="sched-bar">
      <button class="btn ghost sm" onclick="moveMonth(1)">‹ التالي</button>
      <div class="m">${AR_MONTHS[m]} ${y}</div>
      <button class="btn ghost sm" onclick="moveMonth(-1)">السابق ›</button>
    </div>
    <div class="tablewrap">
      <table class="sched">
        <thead><tr><th class="namecol">الاسم</th>${head}</tr></thead>
        <tbody>${rows||''}</tbody>
        <tfoot>${shiftRows}<tr><td class="namecol">إجمالي العاملين</td>${totalCells}</tr></tfoot>
      </table>
    </div>
    <div class="leg">
      <span><i style="background:var(--teal-l)"></i>صباح</span>
      <span><i style="background:var(--amber-l)"></i>عصر</span>
      <span><i style="background:var(--indigo-l)"></i>ليل</span>
      <span><i style="background:#fff;border:1px solid var(--line)"></i>راحة</span>
      <span><i style="background:var(--red-l)"></i>إجازة</span>
      <span><i style="background:var(--teal);border-radius:50%"></i>تعديل يدوي</span>
    </div>
    <p class="hint">اضغط على أي خانة لتغيير الوردية يدوياً. التعديل اليدوي يتجاوز الدورة والإجازات.</p>`;
}
function labelShort(v){
  if(v==='') return '';
  if(v==='صباح') return 'ص'; if(v==='عصر') return 'ع'; if(v==='ليل') return 'ل'; if(v===REST) return '•';
  // إجازات: أول كلمة مختصرة
  const map={'سنوية':'سنوية','عارض':'عارض','دورية':'دورية','مرضية':'مرضية','مرافق مريض':'مرافق','غياب':'غياب'};
  return map[v]||v;
}
function moveMonth(dir){
  let {y,m}=schedMonth; m+=dir; if(m>11){m=0;y++;} if(m<0){m=11;y--;} schedMonth={y,m}; renderSched();
}
function editCell(empId, iso){

  `);

function setCell(empId, iso, val){

// فحص التغطية: كم عدد المُجازين في أيام هذه الإجازة مقابل الحد.
function coverageCheck(l){
  if(l.status!=='معتمد') return {ok:true, text:'الطلب '+l.status};
  let worst=0, worstDay=l.from;
  let d=parseISO(l.from), end=parseISO(l.to);
  while(d<=end){ const iso=toISO(d); const n=dayStats(iso).onLeave; if(n>worst){worst=n;worstDay=iso;} d=addDays(d,1); }
  const max=state.settings.maxLeavesPerDay;
  const ok = worst<=max;
  return {ok, text: ok? `✓ التغطية سليمة (أقصى ${worst}/${max} مُجازين)` : `⚠ تجاوز التغطية: ${worst}/${max} مُجازين بتاريخ ${fmtDate(worstDay)}`};
}

      <div class="pick" id="l-type">${s.leaveTypes.map(t=>`<button data-t="${t}" class="${(l?l.type:s.leaveTypes[0])===t?'on':''}" onclick="pickType(this)">${t}</button>`).join('')}</div>
    </div>
    <div class="two">
      <div class="field"><label>من تاريخ</label><input id="l-from" type="date" value="${l?l.from:s.scheduleStart}" oninput="updLeaveHint()"></div>
      <div class="field"><label>إلى تاريخ</label><input id="l-to" type="date" value="${l?l.to:s.scheduleStart}" oninput="updLeaveHint()"></div>
    </div>
    <div class="field"><label>الحالة</label>
      <div class="pick" id="l-status">${s.statuses.map(t=>`<button data-t="${t}" class="${(l?l.status:'معتمد')===t?'on':''}" onclick="pickStatus(this)">${t}</button>`).join('')}</div>
    </div>
    <div class="field"><label>ملاحظات</label><input id="l-notes" value="${l?esc(l.notes||''):''}" placeholder="اختياري"></div>
    <div class="hint" id="l-hint"></div>
    <button class="btn block" style="margin-top:10px" onclick="saveLeave(${id})">${l?'حفظ التعديلات':'حجز الإجازة'}</button>

  sheet._status = l?l.status:'معتمد';
  updLeaveHint();

function pickType(btn){ btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); sheet._type=btn.dataset.t; updLeaveHint(); }
function pickStatus(btn){ btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); sheet._status=btn.dataset.t; updLeaveHint(); }
function updLeaveHint(){
  const from=val('l-from'), to=val('l-to'); const h=document.getElementById('l-hint'); if(!h) return;
  if(!from||!to){ h.textContent=''; return; }
  if(to<from){ h.className='hint bad'; h.textContent='⚠ تاريخ النهاية قبل البداية'; return; }
  const days=inclusiveDays(from,to);

  h.className='hint ok'; h.textContent=`المدة: ${days} يوم`;
}
function saveLeave(id){

  const rec={ empId, type:sheet._type, from, to, status:sheet._status, notes:val('l-notes').trim() };
  if(id){ const l=state.leaves.find(x=>x.id===id); Object.assign(l,rec); }
  else { rec.id=nextId(state.leaves); state.leaves.push(rec); }
  save(); closeSheet(); renderScreen(current); toast(id?'تم الحفظ':'تم حجز الإجازة');
}
function deleteLeave(id){
  const l=state.leaves.find(x=>x.id===id); if(!l) return;
  if(!confirm('حذف طلب الإجازة؟')) return;
  state.leaves=state.leaves.filter(x=>x.id!==id);

      <div style="margin-top:16px;font-size:13px;color:var(--muted)">توقيع المشرف: ____________________</div>
    </div>
    <button class="btn block no-print" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>`;
}

/* -------------------- الإعدادات -------------------- */
function openSettings(){
  const s=state.settings;
  openSheet(`
    <h3>الإعدادات<button class="x" onclick="closeSheet()">×</button></h3>
    <div class="field"><label>اسم القسم</label><input id="s-dep" value="${esc(s.department)}"></div>
    <div class="two">
      <div class="field"><label>طول دورة العمل (أيام)</label><input id="s-work" type="number" min="1" value="${s.workDays}"></div>
      <div class="field"><label>طول الراحة (أيام)</label><input id="s-rest" type="number" min="1" value="${s.restDays}"></div>
    </div>
    <div class="two">
      <div class="field"><label>الحد الأدنى للعاملين</label><input id="s-min" type="number" min="0" value="${s.minWorkers}"></div>
      <div class="field"><label>أقصى مُجازين/يوم</label><input id="s-max" type="number" min="0" value="${s.maxLeavesPerDay}"></div>
    </div>
    <div class="field"><label>وردية بداية الفريق</label>
      <div class="pick" id="s-start">${WORK_SHIFTS.map(sh=>`<button data-t="${sh}" class="${s.startShift===sh?'on':''}" onclick="pickStart(this)">${sh}</button>`).join('')}</div>
    </div>
    <div class="field"><label>بداية فترة الجدول</label><input id="s-sched" type="date" value="${s.scheduleStart}"></div>
    <button class="btn block" onclick="saveSettings()">حفظ الإعدادات</button>
    <button class="btn block danger" style="margin-top:8px" onclick="resetAll()">استرجاع البيانات الأصلية</button>
    <p class="hint" style="text-align:center;margin-top:12px">البيانات محفوظة على جهازك فقط. أضِف التطبيق إلى الشاشة الرئيسية للعمل دون إنترنت.</p>
  `);
  sheet._start=s.startShift;
}
function pickStart(btn){ btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); sheet._start=btn.dataset.t; }
function saveSettings(){
  const s=state.settings;
  s.department=val('s-dep').trim()||s.department;
  s.workDays=Math.max(1,Number(val('s-work'))||s.workDays);
  s.restDays=Math.max(1,Number(val('s-rest'))||s.restDays);
  s.minWorkers=Math.max(0,Number(val('s-min')));
  s.maxLeavesPerDay=Math.max(0,Number(val('s-max')));
  s.startShift=sheet._start||s.startShift;
  s.scheduleStart=val('s-sched')||s.scheduleStart;
  save(); closeSheet(); document.getElementById('hSub').textContent=s.department; renderScreen(current); toast('تم حفظ الإعدادات');
}

/* -------------------- أدوات واجهة -------------------- */
const sheet=document.getElementById('sheet');
const overlay=document.getElementById('overlay');
function openSheet(html){ sheet.innerHTML=html; overlay.classList.add('open'); }
function closeSheet(){ overlay.classList.remove('open'); }
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeSheet(); });
function val(id){ const el=document.getElementById(id); return el?el.value:''; }
function esc(s){ return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

/* -------------------- ربط الأحداث -------------------- */
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.nav)));
document.getElementById('fab').addEventListener('click',()=>{ if(current==='emps') editEmp(0); else if(current==='leaves') editLeave(0); });
document.getElementById('btnSettings').addEventListener('click', openSettings);

/* -------------------- تشغيل -------------------- */
load();
document.getElementById('hSub').textContent=state.settings.department;
nav('dash');


</script>
