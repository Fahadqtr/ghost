<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#8A1538">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الورديات">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>إدارة الورديات — العمليات الجمركية</title>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="brand-logo">
      <img src="icons/customs-logo.png" alt="شعار الجمارك" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
      <span class="crest" style="display:none">⚖</span>
    </div>
    <div>
      <h1 id="hTitle">إدارة الورديات</h1>
      <div class="sub" id="hSub">قسم العمليات الجمركية</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <span class="sync" id="syncBadge"></span>
    <button class="hbtn" id="btnSettings" title="الإعدادات">⚙️</button>
  </div>
</header>

<main>
  <!-- لوحة المعلومات -->
  <section class="screen active" id="scr-dash"></section>
  <!-- الموظفون -->
  <section class="screen" id="scr-emps"></section>
  <!-- جدول الورديات -->
  <section class="screen" id="scr-sched"></section>
  <!-- الإجازات -->
  <section class="screen" id="scr-leaves"></section>
  <!-- كشف يومي -->
  <section class="screen" id="scr-daily"></section>
  <!-- النقطة الأمنية -->
  <section class="screen" id="scr-point"></section>
  <!-- سجل التعديلات (للمشرفين ورئيس القسم فقط) -->
  <section class="screen" id="scr-audit"></section>
  <section class="screen" id="scr-balances"></section>
</main>

<button class="fab" id="fab" title="إضافة">＋</button>

<nav class="nav">
  <button data-nav="dash" class="active"><span class="ic">🏠</span>الرئيسية</button>
  <button data-nav="emps"><span class="ic">👥</span>الموظفون</button>
  <button data-nav="sched"><span class="ic">🗓️</span>الجدول</button>
  <button data-nav="leaves"><span class="ic">🏖️</span>الإجازات</button>
  <button data-nav="daily"><span class="ic">📋</span>كشف يومي</button>
  <button data-nav="point"><span class="ic">🛡️</span>النقطة</button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<!-- شريط تثبيت التطبيق -->
<div id="installBar" class="install-bar">
  <span class="ic">📲</span>
  <span id="installText" class="grow">ثبّت التطبيق على جهازك</span>
  <button class="btn sm" onclick="doInstall()">تثبيت</button>
  <button class="install-x" onclick="dismissInstall()" aria-label="إغلاق">×</button>
</div>

<!-- شاشات تسجيل الدخول -->
<div class="login" id="login">
  <!-- دخول المشرفين -->
  <div class="login-card" id="login-admin">
    <div class="login-logo">🗓️</div>
    <h2>إدارة الورديات</h2>
    <p class="login-sub">دخول المشرفين — قسم العمليات الجمركية</p>
    <div class="field"><label>اسم المستخدم</label>
      <input id="lg-email" type="text" autocapitalize="none" autocorrect="off" autocomplete="username" placeholder="مثال: salemm"></div>
    <div class="field"><label>كلمة المرور</label>
      <input id="lg-pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <div class="hint bad" id="lg-err"></div>
    <button class="btn block" id="lg-btn" onclick="doLogin()">دخول</button>
    <button class="linkbtn" onclick="showEmpLogin()">دخول الموظفين بالرقم الوظيفي ←</button>
  </div>
  <!-- دخول الموظفين (عرض فقط) -->
  <div class="login-card" id="login-emp" style="display:none">
    <div class="login-logo">👁️</div>
    <h2>عرض الورديات</h2>
    <p class="login-sub">للموظفين — الدخول بالرقم الوظيفي</p>
    <div class="field"><label>الرقم الوظيفي</label>
      <input id="lg-empno" type="text" inputmode="numeric" autocomplete="off" placeholder="مثال: 4756"></div>
    <div class="hint bad" id="lg-emperr"></div>
    <button class="btn block" id="lg-empbtn" onclick="doEmpLogin()">عرض الجدول</button>
    <button class="linkbtn" onclick="showAdminLogin()">→ دخول المشرفين</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="seed.js"></script>
<script src="config.js"></script>
<script src="cloud.js"></script>
<script src="qr.js"></script>
<script src="app.js"></script>
</body>
</html>
