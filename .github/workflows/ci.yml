name: CI

# Runs the commerce-ai-os checks on every PR to master (and on master itself).
# Split into three jobs — typecheck / test / build — so each shows up as its own
# status check. The `protect-master` ruleset requires all three to pass before a
# PR can merge.
#
# NO path filters: the ruleset requires these checks on EVERY PR, and a
# filtered-out workflow never reports its checks — which would leave a PR that
# only touches files outside commerce-ai-os/ blocked on "Expected" forever.
# The jobs are fast (~1 min total), so always running them is the safe trade.
#
# The weekly schedule re-runs everything on master — mainly so `audit` surfaces
# NEW dependency advisories without waiting for the next PR.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC (08:00 Qatar)

# Cancel superseded runs on the same ref (a new push aborts the in-flight one).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only checks out and runs build/test/guard —
# none writes to the repo, comments, or deploys. Read-only token.
permissions:
  contents: read

defaults:
  run:
    working-directory: commerce-ai-os

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: commerce-ai-os/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: commerce-ai-os/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: commerce-ai-os/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Placeholder env only — the build prerenders pages that read Supabase env,
      # so it needs the vars PRESENT (not real). No secrets required in CI.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role
          MALAK_SIGNING_SECRET: placeholder-signing-secret-ci

  # Lint. Deliberately NOT in the ruleset's required checks (yet): the config
  # relaxes deliberate-pattern rules to warnings, so this stays green today and
  # acts as a floor — it fails only on genuine new errors. Promote to required
  # once the warning backlog is worked down.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: commerce-ai-os/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # Dependency advisories. Deliberately NOT in the ruleset's required checks:
  # a new upstream advisory can turn this red on a PR that didn't touch deps,
  # and that shouldn't block unrelated work — red here means "look at deps",
  # enforced by humans (and fixed by Dependabot PRs), not by the merge gate.
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: commerce-ai-os/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        # npm retired the /security/audits "quick" endpoint (410 Gone) that
        # `pnpm audit` calls, so it now errors for infra reasons on every run,
        # unrelated to any real advisory. Tolerate that specific failure (surface
        # a warning) while still failing on genuine high-severity findings.
      - name: audit
        run: |
          set +e
          out=$(pnpm audit --audit-level high 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ] && echo "$out" | grep -qE "ERR_PNPM_AUDIT_BAD_RESPONSE|being retired|410"; then
            echo "::warning::npm audit endpoint retired (410) — advisory gate skipped until pnpm/npm move to the bulk endpoint"
            exit 0
          fi
          exit $code

  # Supabase migration schema-compatibility guard for the daily-operations
  # dashboard (Phase 6). Runs against a THROWAWAY local Postgres service — no
  # Supabase connection, no secrets, no production data. Reproduces the exact
  # scaffold-fidelity failure class that broke the first production apply
  # (a migration referencing a leaves column that does not exist on prod).
  # This job does NOT touch commerce-ai-os, so it overrides the workflow's
  # working-directory default.
  dashboard-schema:
    name: dashboard-schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure psql client
        run: command -v psql >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)
      - name: Run daily-operations dashboard schema guard
        env:
          # Local service container only — NOT production; no secrets used.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash "$GITHUB_WORKSPACE/supabase/tests/daily_operations_dashboard_schema.sh"

  # Attendance-foundation (Phase 7) schema-compatibility guard. Same throwaway
  # postgres:16 service, no Supabase, no secrets. Verifies the attendance
  # migration applies against a production-faithful schema and asserts objects,
  # grants, RLS, partial-unique open-session index, zero DML, atomicity, and a
  # negative missing-column test.
  attendance-schema:
    name: attendance-schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure psql client
        run: command -v psql >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)
      - name: Run attendance foundation schema guard
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash "$GITHUB_WORKSPACE/supabase/tests/attendance_foundation_schema.sh"

  work-schedule-schema:
    name: work-schedule-schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure psql client
        run: command -v psql >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)
      - name: Run work schedule policy schema guard
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash "$GITHUB_WORKSPACE/supabase/tests/work_schedule_policy_schema.sh"

  # Aggregate gate. There is no in-repo "final" job today (the protect-master
  # ruleset lists individual checks), so this job gives a single check that is
  # RED whenever any currently-required check OR the new schema guard fails —
  # i.e. a failing dashboard-schema fails ci-success. lint and audit stay
  # advisory (deliberately excluded here) so this does not promote them.
  # NOTE (admin action, outside this repo): add `dashboard-schema` (or switch to
  # `ci-success`) in the protect-master ruleset's required checks to make the
  # guard merge-blocking; a workflow file cannot edit the ruleset itself.
  ci-success:
    name: ci-success
    if: always()
    needs: [typecheck, test, build, dashboard-schema, attendance-schema, work-schedule-schema]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Verify required checks passed
        run: |
          echo "typecheck=${{ needs.typecheck.result }} test=${{ needs.test.result }} build=${{ needs.build.result }} dashboard-schema=${{ needs.dashboard-schema.result }} attendance-schema=${{ needs.attendance-schema.result }} work-schedule-schema=${{ needs.work-schedule-schema.result }}"
          bad=""
          for kv in \
            "typecheck:${{ needs.typecheck.result }}" \
            "test:${{ needs.test.result }}" \
            "build:${{ needs.build.result }}" \
            "dashboard-schema:${{ needs.dashboard-schema.result }}" \
            "attendance-schema:${{ needs.attendance-schema.result }}" \
            "work-schedule-schema:${{ needs.work-schedule-schema.result }}"; do
            name=${kv%%:*}; res=${kv#*:}
            if [ "$res" != "success" ]; then echo "::error::required check '$name' = $res"; bad=1; fi
          done
          if [ -n "$bad" ]; then exit 1; fi
          echo "all required checks passed (including dashboard-schema, attendance-schema, work-schedule-schema)"
