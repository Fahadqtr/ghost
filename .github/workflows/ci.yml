name: CI

# Runs the commerce-ai-os checks on every PR to master (and on master itself).
# Split into three jobs — typecheck / test / build — so each shows up as its own
# status check. The `protect-master` ruleset requires all three to pass before a
# PR can merge.
on:
  push:
    branches: [master]
    paths:
      - "commerce-ai-os/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "commerce-ai-os/**"
      - ".github/workflows/ci.yml"

# Cancel superseded runs on the same ref (a new push aborts the in-flight one).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: commerce-ai-os

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: commerce-ai-os/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: commerce-ai-os/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: commerce-ai-os/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Placeholder env only — the build prerenders pages that read Supabase env,
      # so it needs the vars PRESENT (not real). No secrets required in CI.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role
          MALAK_SIGNING_SECRET: placeholder-signing-secret-ci
