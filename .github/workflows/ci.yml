name: CI

# Runs the commerce-ai-os checks on every PR to master (and on master itself).
# Vercel only builds the app; nothing was running the unit tests or the type
# checker, so a PR could merge red. This gate closes that gap.
on:
  push:
    branches: [master]
    paths:
      - "commerce-ai-os/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "commerce-ai-os/**"
      - ".github/workflows/ci.yml"

# Cancel superseded runs on the same ref (a new push aborts the in-flight one).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce-ai-os
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: commerce-ai-os/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      # Placeholder env only — the build prerenders pages that read Supabase env,
      # so it needs the vars PRESENT (not real). No secrets required in CI.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role
          MALAK_SIGNING_SECRET: placeholder-signing-secret-ci
