name: Claude Code

# PHASE 1 — READ-ONLY SMOKE TEST.
# Lets the repository owner ask Claude questions by writing "@claude" in an
# issue, an issue/PR comment, or a PR review. ChatGPT (via the ChatGPT Codex
# Connector) posts as Fahadqtr, so it is covered by the same allowlist.
# In this phase Claude can READ the repo and REPLY in a comment. It cannot edit
# files, commit, push, open PRs, merge, or deploy. Write access is a separate,
# later change that must go through its own reviewed PR.
#
# SECURITY MODEL — read before changing anything here:
# 1. Allowlist: runs ONLY when the actor, triggering actor, and sender are the
#    User `Fahadqtr`, and the comment/review/issue author is `Fahadqtr` with
#    OWNER association. PR events from forks are rejected. Anyone else, and every
#    bot, is skipped before a runner starts. `allowed_bots` and
#    `allowed_non_write_users` are intentionally unset.
# 2. Token: Claude uses this job's GITHUB_TOKEN (passed as `github_token`), NOT
#    the Claude GitHub App token, so the `permissions:` block below is the hard
#    ceiling on what it can do: contents READ only (no push, no merge).
# 3. Permission mode `default` with an explicit tool allowlist: anything not
#    listed is denied (a workflow has no one to approve prompts). The action's
#    own default, `auto`, would let a safety review allow unlisted calls.
# 4. Human gate: the job runs in the `claude` GitHub Environment. The owner
#    configures it with Fahadqtr as required reviewer and keeps
#    ANTHROPIC_API_KEY as an environment secret there, so every run waits for
#    an explicit approval click before any API spend.
# 5. No production access: the only secret read is ANTHROPIC_API_KEY. No
#    Supabase, Vercel, Shopify, or signing secrets; no web access.
# 6. Cost: 10-min timeout, 10 turns, --max-budget-usd 1 per run, one run at a
#    time per issue/PR, plus a monthly cap on the key's dedicated Console
#    workspace.
# 7. Supply chain: actions pinned to full commit SHAs; checkout does not
#    persist credentials.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# Default for every job: no token permissions at all.
permissions: {}

# One Claude run per issue/PR at a time; new mentions queue instead of
# stacking parallel (billable) runs.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      github.repository == 'Fahadqtr/ghost' &&
      github.actor == 'Fahadqtr' &&
      github.triggering_actor == 'Fahadqtr' &&
      github.event.sender.login == 'Fahadqtr' &&
      github.event.sender.type == 'User' &&
      (
        (github.event_name == 'issue_comment'
          && github.event.comment.user.login == 'Fahadqtr'
          && github.event.comment.author_association == 'OWNER'
          && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment'
          && github.event.comment.user.login == 'Fahadqtr'
          && github.event.comment.author_association == 'OWNER'
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review'
          && github.event.review.user.login == 'Fahadqtr'
          && github.event.review.author_association == 'OWNER'
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues'
          && github.event.issue.user.login == 'Fahadqtr'
          && github.event.issue.author_association == 'OWNER'
          && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Human approval gate (configure required reviewers on this environment).
    environment: claude
    # Hard ceiling for the token Claude uses (github_token below).
    permissions:
      contents: read         # read code only: cannot push, cannot merge
      issues: write          # reply on issues
      pull-requests: write   # reply on PRs
      actions: read          # read CI results
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude (read-only)
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: |
            --model claude-sonnet-5-5
            --permission-mode default
            --max-turns 10
            --max-budget-usd 1
            --allowedTools "Read,Glob,Grep,LS,Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch,Read(**/.env*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git rm:*)"
            --append-system-prompt "READ-ONLY SMOKE TEST. Follow CLAUDE.md at the repository root. Answer in a comment only. Do not edit files, commit, push, open or merge pull requests, deploy, or touch production data or credentials."
