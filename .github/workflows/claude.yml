name: Claude Code

# Lets the repository owner hand tasks to Claude by writing "@claude" in an
# issue, an issue/PR comment, or a PR review. ChatGPT (via the ChatGPT Codex
# Connector) posts as Fahadqtr, so it is covered by the same allowlist.
#
# SECURITY MODEL — read before changing anything here:
# 1. Allowlist: runs ONLY when both the triggering actor and the author of the
#    triggering comment/review/issue are `Fahadqtr` (a User, OWNER association),
#    and PR events must come from a same-repo branch, not a fork. Anyone else,
#    and every bot, is skipped before a runner even starts.
#    Claude is also blocked from reading .env files and from editing
#    .github/** or CLAUDE.md, so it cannot widen its own permissions. `allowed_bots` is intentionally unset
#    (the action rejects bot actors by default).
# 2. No merge / no master writes: Claude works on its own `claude/*` branch and
#    opens PRs. `master` is guarded by the `protect-master` ruleset (PR required,
#    required checks, no bypass actors) — that is the hard gate, not this file.
# 3. No production access: the ONLY secret this workflow reads is
#    ANTHROPIC_API_KEY. No Supabase, Vercel, Shopify, or signing secrets are
#    passed, and no deploy tools/commands are allowed.
# 4. Cost controls: 15-min job timeout, turn cap, one run at a time per
#    issue/PR, tool allowlist, no web access. Also set a monthly spend limit on
#    the API key's workspace in the Anthropic Console (see CLAUDE.md).
# 5. Supply chain: third-party actions are pinned to full commit SHAs.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# Default for every job: no token permissions at all.
permissions: {}

# One Claude run per issue/PR at a time; new mentions queue instead of
# stacking parallel (billable) runs.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Defense in depth: actor, triggering actor, sender, AND content author must
    # all be Fahadqtr with OWNER association. PR events from forks are rejected.
    if: |
      github.repository == 'Fahadqtr/ghost' &&
      github.actor == 'Fahadqtr' &&
      github.triggering_actor == 'Fahadqtr' &&
      github.event.sender.login == 'Fahadqtr' &&
      github.event.sender.type == 'User' &&
      (
        (github.event_name == 'issue_comment'
          && github.event.comment.user.login == 'Fahadqtr'
          && github.event.comment.author_association == 'OWNER'
          && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment'
          && github.event.comment.user.login == 'Fahadqtr'
          && github.event.comment.author_association == 'OWNER'
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review'
          && github.event.review.user.login == 'Fahadqtr'
          && github.event.review.author_association == 'OWNER'
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues'
          && github.event.issue.user.login == 'Fahadqtr'
          && github.event.issue.author_association == 'OWNER'
          && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Minimum the action needs: push a claude/* branch, open/comment on PRs and
    # issues, exchange an OIDC token for the Claude GitHub App token, and read
    # CI results. No admin, workflows, packages, pages, deployments, or secrets.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 25
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "WebFetch,WebSearch,Read(**/.env*),Edit(.github/**),MultiEdit(.github/**),Write(.github/**),Edit(CLAUDE.md),MultiEdit(CLAUDE.md),Write(CLAUDE.md)"
            --append-system-prompt "Follow CLAUDE.md at the repository root. Never merge pull requests, never push to master, never deploy, never touch production data or credentials. Work on a claude/* branch, open a pull request, and wait for human review."
