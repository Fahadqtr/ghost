name: نشر تطبيق الورديات على GitHub Pages

# ينشر محتوى مجلد shift-app/ كموقع GitHub Pages.
# الرابط الناتج: https://<user>.github.io/ghost/
on:
  push:
    branches: [master]
    paths: ['shift-app/**', '.github/workflows/shift-app-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تهيئة Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: كسر التخزين المؤقت (إضافة رقم إصدار لكل ملف)
        # يضيف ?v=<رقم الإصدار> لروابط الملفات المحلية في index.html،
        # فيجلب المتصفح دائماً أحدث نسخة عند كل نشر دون مسح يدوي للكاش.
        run: |
          VER="${GITHUB_SHA::8}"
          sed -i -E "s@(href=\"styles\.css)\"@\1?v=${VER}\"@; s@(src=\"(seed|config|cloud|app)\.js)\"@\1?v=${VER}\"@g" shift-app/index.html
          echo "نسخة الكاش: ${VER}"
          grep -E "styles\.css|app\.js" shift-app/index.html || true

      - name: رفع محتوى التطبيق
        uses: actions/upload-pages-artifact@v3
        with:
          path: shift-app

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
